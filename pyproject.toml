[project]
name = "loopstop"
version = "0.1.0"
description = "LoopStopBench: measuring, benchmarking and learning stopping decisions in LLM agent loops"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# harness 容器安装 full；核心库与测试只依赖标准库 + requests/pyyaml
full = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "sentence-transformers>=3.0",
    "evalplus>=0.3.1",
    "datasets>=2.19",
    "ruff>=0.4",
    "joblib>=1.4",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
