# Code-repair loop.
loop_type: code_repair
rounds: 15                 # Full-horizon collection.
temperature: 0.7
max_tokens: 2048
test_timeout: 5             # Per-case soft timeout in seconds.
honest_feedback: true       # Allow a passing solution to remain unchanged.

dataset: humaneval_plus    # humaneval_plus | mbpp_plus
# Task cache after first-round difficulty filtering.
task_cache: data/raw/code_tasks_filtered.json
